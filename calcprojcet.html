<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Interest Calculator</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:linear-gradient(to right, #4facfe, #00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:rgb(151, 129, 129);
            padding:30px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            width:350px;
            text-align:center;
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:10px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        #result{
            margin-top:20px;
            color:green;
            font-size:20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Simple Interest Calculator</h1>

        <input type="number" id="principal" placeholder="Enter Principal Amount">

        <input type="number" id="rate" placeholder="Enter Rate of Interest (%)">

        <input type="number" id="time" placeholder="Enter Time (Years)">

        <button onclick="calculateSI()">Calculate</button>

        <h2 id="result"></h2>
    </div>

    <script>
        function calculateSI() {
            let p = document.getElementById("principal").value;
            let r = document.getElementById("rate").value;
            let t = document.getElementById("time").value;

            let si = (p * r * t) / 100;

            document.getElementById("result").innerHTML =
                "Simple Interest = ₹" + si;
        }
    </script>

</body>
</html>
