<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function pattern(){
        let n=parseInt(prompt("eneter"));
        for(let i=0;i<n;i++)
        {
            for(let j=0;j<=i;j++)
            {document.write("*");
            }
            document.write("<br>");
        }       
    }
        </script>
        <button type="button" value="Result" onclick="pattern()">Result</button>

</body>
</html>
