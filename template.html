</head>
<body>
    <script>
        let first = "krishna";
        let second = "maheshwari";

        document.write(first + " " + second);

        console.log("my name is " + first + " " + second);

        let fullName = `my name is ${first} ${second}`;
        console.log(fullName);

        function getFullName(first, second) {
            return `my name is ${first} ${second}`;
        }
        console.log(getFullName(first, second));
    </script>
