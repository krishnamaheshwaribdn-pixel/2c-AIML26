<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function f(fn) {
            return fn;
        }

        function l(ln) {
            return ln;
        }

        function showName() {
            let firstname = f("Krishna");
            let lastname = l("Maheshwari");

            document.write("First Name: " + firstname + " " + lastname);
        }
    </script>
</head>
<body>

    <input type="button" value="Result" onclick="showName()">

    <p id="result"></p>

</body>
</html>
