<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        

        function display(){
            let n=parseInt(prompt("enter the value of n"));
            for(let i=0;i<n;i++)
        {
            for(let j=0;j<=i;j++)
            {document.write("*");
            }
            document.write("<br>");
        }       
     }
        </script>
</head>
<body>

    <input type="button" value="Result" onclick="display()">

    <p id="result"></p>

</body>
</html>
